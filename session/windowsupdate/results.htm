<html dir="ltr">
<!-- The pages of updates of the Windows Update site (results.asp): its
     server drew them from what the site posted to it, and the Internet
     Archive kept none. This draws them from that, by the site's styles
     (content.css) and its scripts' structure (content.js, top2.js): the
     strings are the site's where they are known, its Catalog's otherwise. -->
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=windows-1252" />
		<meta http-equiv="MSThemeCompatible" content="yes" />
		<script language="JScript" type="text/javascript" src="shared/js/content.js"></script>
		<link rel="stylesheet" type="text/css" href="shared/css/hcp.css" />
		<link rel="stylesheet" type="text/css" href="shared/css/content.css" />
		<title>Content Frame</title>
		<script language="JScript" type="text/javascript">
var L_CriticalTitle_Text = "Critical Updates and Service Packs";
var L_CriticalDesc_Text = "Critical updates are added to your list of total selected updates automatically. To install them, click <b>Review and install updates</b>, and then click <b>Install Now</b>.";
var L_ProductDesc_Text = "Updates for |PRODUCT|. To add an update to your list of total selected updates, click <b>Add</b>. To install the updates you have selected, click <b>Review and install updates</b>.";
var L_DriversTitle_Text = "Driver Updates";
var L_DriversDesc_Text = "Updates for the drivers of your hardware devices. To add an update to your list of total selected updates, click <b>Add</b>.";
var L_BasketTitle_Text = "Total Selected Updates";
var L_BasketDesc_Text = "Review and install your selected updates. To start the installation, click <b>Install Now</b>. To remove an update from your list, click <b>Remove</b>.";
var L_BasketEmpty_Text = "There are no updates in your list of total selected updates.";
var L_NoUpdates_Text = "There are no updates available at this time.";
var L_ReviewInstall_Text = "Review and install updates";
var L_InstallNow_Text = "Install Now";
var L_Add_Text = "Add";
var L_Remove_Text = "Remove";
var L_Added_Text = "Added";
var L_DownloadSize_Text = "Download size:";
var L_InstalledVersion_Text = "Installed version:";

function fnEscape(s){
	return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fnUpdateHTML(oPosted, iSubPage){
	var sID, oItem, sHTML, oNode, sSize;

	sID = oPosted.selectSingleNode("identity/@itemID").text;
	oItem = parent.g_oCatalogXML.selectSingleNode("provider/product/group/item[identity/@itemID = '" + sID + "']");
	if(oItem == null) return "";
	sSize = parent.fnGetDownloadSizeText(parseInt(oItem.selectSingleNode("size").text));

	sHTML = "<div class=\"update\" id=\"" + fnEscape(sID) + "\" productid=\"" + fnEscape(oPosted.getAttribute("productid") || "") + "\">";
	sHTML += "<div class=\"updateTitle\">" + fnEscape(oItem.selectSingleNode("title").text) + "</div>";
	if(parseInt(oItem.selectSingleNode("size").text) > 0) sHTML += L_DownloadSize_Text + " " + sSize + "<br />";
	oNode = oItem.selectSingleNode("installedVersion");
	if(oNode != null) sHTML += L_InstalledVersion_Text + " " + fnEscape(oNode.text) + "<br />";
	oNode = oItem.selectSingleNode("description");
	if(oNode != null && oNode.text != "") sHTML += "<span>" + fnEscape(oNode.text) + "</span><br />";
	oNode = oItem.selectSingleNode("details/@href");
	if(oNode != null) sHTML += "<a href=\"\" class=\"sys-link-normal\" onclick=\"parent.fnOpenDetails('" + fnEscape(oNode.text) + "');return false;\">" + parent.L_ReadMore_Text + "</a><br />";
	sHTML += "<span class=\"dependencies\" style=\"display: none;\"></span><br style=\"display: none;\" />";
	if(iSubPage == parent.conResultsBasket){
		sHTML += "<div class=\"buttons\"><span style=\"visibility: hidden;\"></span><button onclick=\"parent.fnRemoveFromBasket(this);\">" + L_Remove_Text + "</button></div>";
	}else{
		sHTML += "<div class=\"buttons\"><span style=\"visibility: hidden;\">" + L_Added_Text + "</span><button onclick=\"parent.fnAddUpdate(this);\">" + L_Add_Text + "</button><button onclick=\"parent.fnRemoveUpdate(this);\" disabled=\"true\">" + L_Remove_Text + "</button></div>";
	}
	return sHTML + "</div>";
}

function fnLoad(){
	var sID, iSubPage, oXML, sTitle, sDesc, vGroups, vItems, sHTML, oProduct, sGroup, i, j;

	if(self == top || parent.g_sPostedURL == null) return false;
	sID = parent.fnGetQueryString(parent.g_sPostedURL, "id");
	oXML = parent.xmlNewXML();
	oXML.loadXML(parent.g_sPostedXML);
	sHTML = "";

	if(sID == "critical"){
		iSubPage = parent.conResultsCritical;
		sTitle = L_CriticalTitle_Text;
		sDesc = L_CriticalDesc_Text;
	}else if(sID == "basket"){
		iSubPage = parent.conResultsBasket;
		sTitle = L_BasketTitle_Text;
		sDesc = L_BasketDesc_Text;
	}else if(sID == "drivers"){
		iSubPage = parent.conResultsDrivers;
		sTitle = L_DriversTitle_Text;
		sDesc = L_DriversDesc_Text;
	}else{
		iSubPage = parent.conResultsProduct;
		oProduct = parent.g_oCatalogXML.selectSingleNode("provider/product[identity/@itemID = '" + sID + "']");
		sTitle = (oProduct == null) ? "" : oProduct.selectSingleNode("title").text;
		sDesc = L_ProductDesc_Text.replace("|PRODUCT|", fnEscape(sTitle));
	}

	vGroups = oXML.selectNodes("catalog//group");
	if(vGroups.length > 0){
		for(i = 0; i < vGroups.length; i++){
			vItems = vGroups[i].selectNodes("item");
			if(vItems.length == 0) continue;
			sGroup = vGroups[i].selectSingleNode("identity/@name");
			if(sGroup != null && sGroup.text != "") sHTML += "<div class=\"group sys-toppane-header-color sys-toppane-header-bgcolor sys-font-body-bold\">" + fnEscape(sGroup.text) + "</div>";
			for(j = 0; j < vItems.length; j++) sHTML += fnUpdateHTML(vItems[j], iSubPage);
		}
	}else{
		vItems = oXML.selectNodes("catalog/item");
		for(j = 0; j < vItems.length; j++) sHTML += fnUpdateHTML(vItems[j], iSubPage);
	}
	if(sHTML == "") sHTML = "<br /><center><b>" + ((iSubPage == parent.conResultsBasket) ? L_BasketEmpty_Text : L_NoUpdates_Text) + "</b></center>";

	eTitle.innerText = sTitle;
	ePageDesc.innerHTML = sDesc;
	eUpdatesContainer.innerHTML = sHTML;
	if(iSubPage == parent.conResultsBasket){
		eBasketLink.style.display = "none";
		eInstallLink.style.display = "inline";
	}else{
		eBasketCalculating.style.display = "none";
	}

	// what the server's page came with
	g_iSubPage = iSubPage;
	fnUpdateButtonStates();
	fnInitResults(parent.conResultsPage, iSubPage);
	if(iSubPage == parent.conResultsProduct && "object" == typeof(parent.eTOC.document.all[sID])) parent.eTOC.fnLinkSelect(parent.eTOC.document.all[sID]);
}
		</script>
	</head>
	<body onload="fnLoad();" class="results">
		<table cellspacing="0">
			<tbody>
				<tr>
					<td class="resultsTop">
						<div class="resultsPageInfo">
							<span id="eTitle" class="sys-font-heading3 sys-rhp-color-title"></span><br /><br />
							<span id="ePageDesc"></span><span id="ePageDescCanceledEULA"></span>
						</div>
					</td>
				</tr>
				<tr class="resultsBasketBar">
					<td class="sys-table-header-bgcolor1 sys-table-color-border sys-toppane-header-color">
						<button id="eInstallLink" onclick="parent.fnInstall();" style="display: none;width: auto;"><img src="shared/images/install.gif" align="absmiddle" />&nbsp;Install Now</button>
						<a id="eBasketLink" href="javascript:parent.fnDisplayBasketUpdates();" class="sys-font-body-bold" style="color: white;">Review and install updates</a>
						&nbsp;<span id="eBasketCalculating"></span> <span id="eBasketStats" class="sys-font-body-bold"></span>
					</td>
				</tr>
				<tr>
					<td style="height: 100%;padding: 0px;">
						<div id="eUpdatesContainer"></div>
					</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
