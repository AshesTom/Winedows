# picom (v12 and later) for Aero glass, which the Windows 7 session starts:
# it blends Wine's glass windows (_WIN4WINE_GLASS, Wine patches 0152 and
# 0153) by the alpha of their pixels and blurs what is behind them, as
# Windows 7's desktop window manager does. Wine already puts the window color
# and the glass's reflection under their pixels. Nothing else: no shadows,
# fades or opacity of other windows (Aero Peek sets _NET_WM_WINDOW_OPACITY).
backend = "xrender";
vsync = false;
shadow = false;
fading = false;
blur-method = "gaussian";
blur-size = 11;
blur-deviation = 5;
blur-background-fixed = true;
rules = (
    { match = "_WIN4WINE_GLASS = 1"; blur-background = true; },
    { match = "!_WIN4WINE_GLASS"; blur-background = false; }
);
