# picom for Aero glass (W7_AERO=1, session.json "aero"): it blends Wine's glass
# windows (_WIN4WINE_GLASS, Wine patch 0152) by the alpha of their pixels and
# blurs what is behind them, as Windows 7's desktop window manager does. Wine
# already puts the colorization color under the window's pixels. Nothing else:
# no shadows, fades or opacity of other windows.
backend = "xrender";
vsync = false;
shadow = false;
fading = false;
inactive-opacity = 1;
frame-opacity = 1;
detect-client-opacity = false;
blur-method = "gaussian";
blur-size = 11;
blur-deviation = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = true;
blur-background-exclude = [ "!_WIN4WINE_GLASS@:32c = 1" ];
